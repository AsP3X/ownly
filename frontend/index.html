<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  <!-- Human: SVG for desktop; PNG + apple-touch-icon for iOS Safari (no reliable SVG favicon). -->
  <!-- Agent: STATIC assets from public/; apple-touch-icon 180px for iOS tabs and home screen. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- Human: device-width + initial-scale=1; viewport-fit for notched iPhones. Avoid maximum-scale (a11y). -->
    <!-- Agent: Form fields use ≥16px on mobile so iOS Safari does not auto-zoom on focus. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Ownly</title>
    <!-- Human: Apply the saved theme before first paint so dark users never see a white flash. -->
    <!-- Agent: READS localStorage ownly_theme (light|dark|system); WRITES the `dark` class on <html>. -->
    <!--         Mirrors lib/theme-preference.ts — keep the storage key and class name in sync. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("ownly_theme");
          var pref = saved === "light" || saved === "dark" ? saved : "system";
          var dark =
            pref === "dark" ||
            (pref === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
        } catch (error) {
          /* Agent: Private mode or disabled storage — fall through to the light default. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
