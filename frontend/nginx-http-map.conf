# Human: Shared nginx maps for WebSocket upgrade + quieter collab access logs.
# Agent: INCLUDED from http context via conf.d; USED by default.conf.template.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Human: Skip access-log lines for high-frequency collab poll/ops/heartbeat.
# Agent: if=$log_collab_request on access_log; 0 = do not log.
map $request_uri $log_collab_request {
    default                                                 1;
    ~*/document/sessions/[^/]+/(ops|heartbeat)(\?|$)        0;
    ~*/spreadsheet/sessions/[^/]+/(ops|heartbeat)(\?|$)     0;
}
