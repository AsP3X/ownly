openapi: 3.1.0
info:
  title: Ownly API
  version: 0.1.0
  description: |
    HTTP API for the Ownly self-hosted personal cloud.
    All authenticated routes require `Authorization: Bearer <jwt>`.
    Errors use `{ "error": { "code": string, "message": string } }`.
servers:
  - url: /api/v1
paths:
  /health/ready:
    get:
      summary: Readiness probe
      responses:
        "200":
          description: API and database reachable
  /auth/login:
    post:
      summary: Authenticate and receive JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "200":
          description: Token issued
        "401":
          description: Invalid credentials
  /files:
    get:
      summary: List files (optional folder_id, q search, type_filter)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: q
          schema: { type: string }
          description: Filename or extension search
        - in: query
          name: folder_id
          schema: { type: string }
      responses:
        "200":
          description: Paginated file list
  /files/{id}:
    patch:
      summary: Rename and/or move a file
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, description: Rename in place }
                folder_id:
                  nullable: true
                  type: string
                  description: Move target folder; null for drive root
      responses:
        "200":
          description: Updated file row
        "409":
          description: Name collision in folder
  /favourites:
    get:
      summary: List the signed-in account's starred file ids
      description: >-
        Returns starred file ids, newest star first. Recycled files are omitted and reappear
        if the file is restored.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Starred file ids
          content:
            application/json:
              schema:
                type: object
                properties:
                  file_ids:
                    type: array
                    items: { type: string }
    post:
      summary: Star files for this account
      description: >-
        Idempotent. Ids the caller does not own, or that are in the recycle bin, are ignored.
        At most 500 ids per request.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FavouriteIdsRequest" }
      responses:
        "200":
          description: Requested ids and how many rows changed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FavouriteMutationResponse" }
        "400":
          description: More than 500 file ids requested
    delete:
      summary: Remove the star from files for this account
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FavouriteIdsRequest" }
      responses:
        "200":
          description: Requested ids and how many rows changed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FavouriteMutationResponse" }
        "400":
          description: More than 500 file ids requested
  /folders:
    get:
      summary: List folders or search by name (q)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: parent_id
          schema: { type: string }
      responses:
        "200":
          description: Paginated folder list
  /folders/paths:
    post:
      summary: Resolve root-first folder trails for many folders at once
      description: >-
        Returns the breadcrumb trail for each requested folder, ordered root first and
        including the folder itself. Ids the caller does not own are omitted from the
        response. At most 64 ids per request.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  items: { type: string }
      responses:
        "200":
          description: Map of folder id to its root-first trail
          content:
            application/json:
              schema:
                type: object
                properties:
                  paths:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        type: object
                        properties:
                          id: { type: string }
                          name: { type: string }
        "400":
          description: More than 64 folder ids requested
  /folders/{id}:
    patch:
      summary: Rename folder
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        "200":
          description: Updated folder row
  /me/sessions:
    get:
      summary: List the caller's active sign-in sessions
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Session rows derived from auth.login / auth.register audit logs
  /me/sessions/{session_id}/revoke:
    post:
      summary: Revoke one of the caller's sessions (not the current JWT)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: session_id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Session revoked
        "400":
          description: Attempted to revoke the current session
        "404":
          description: Session not found for this user
  /me/sessions/revoke-others:
    post:
      summary: Revoke all sessions except the caller's current JWT sid
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Other sessions revoked
  /collab/sessions:
    post:
      summary: Join or create a live collab session (document or spreadsheet)
      security: [{ bearerAuth: [] }]
      description: |
        Shared collab engine. Requires content.read on the file.
        See docs/collab-engine.md for OT protocol, locks, and WebSocket frames.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [room_kind, file_id]
              properties:
                room_kind:
                  type: string
                  enum: [document, spreadsheet]
                file_id: { type: string }
                display_name: { type: string }
                seed: { type: object }
                initial_html: { type: string }
                initial_text: { type: string }
      responses:
        "200":
          description: Session snapshot with participants and latest_seq
        "401":
          description: Unauthorized
  /collab/sessions/{session_id}:
    get:
      summary: Collab session snapshot
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: session_id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Participants, latest_seq, domain snapshot
  /collab/sessions/{session_id}/heartbeat:
    post:
      summary: Update presence (selection/locks or active_cell)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: session_id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Updated session view
  /collab/sessions/{session_id}/ops:
    get:
      summary: List ops after a sequence number
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: session_id
          required: true
          schema: { type: string }
        - in: query
          name: after_seq
          schema: { type: integer, minimum: 0 }
      responses:
        "200":
          description: Ordered op list
    post:
      summary: Submit a collab op (base_seq OT)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: session_id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [base_seq, op_type, payload]
              properties:
                base_seq: { type: integer }
                op_type: { type: string }
                payload: { type: object }
                client_op_id: { type: string }
      responses:
        "200":
          description: Stored op with assigned seq
        "409":
          description: Lock conflict or format_commit text_mismatch
  /collab/sessions/{session_id}/ws:
    get:
      summary: Bidirectional collab WebSocket
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: session_id
          required: true
          schema: { type: string }
      responses:
        "101":
          description: WebSocket upgrade
  /public/shares/{token}/collab/sessions:
    post:
      summary: Join document collab on an allow_edit public share
      parameters:
        - in: path
          name: token
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [file_id, guest_id]
              properties:
                file_id: { type: string }
                guest_id: { type: string }
                display_name: { type: string }
                room_kind: { type: string, enum: [document] }
                initial_html: { type: string }
                initial_text: { type: string }
      responses:
        "200":
          description: Guest session view
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    FavouriteIdsRequest:
      type: object
      required: [file_ids]
      properties:
        file_ids:
          type: array
          items: { type: string }
    FavouriteMutationResponse:
      type: object
      properties:
        file_ids:
          type: array
          items: { type: string }
        changed:
          type: integer
          description: Rows actually inserted or deleted; 0 when the request was a no-op.
