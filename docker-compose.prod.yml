# Human: Production Compose overlay — merge with docker-compose.yml for internet-facing deployments.
# Agent: RUN `docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build`
#        REQUIRES strong POSTGRES_PASSWORD, unique secrets, and explicit CORS_ALLOWED_ORIGINS.
#
# No service publishes a host port. Reach the stack through an edge proxy on
# proxy-network (Nginx Proxy Manager, Traefik, …) targeting ownly-frontend:80.
# FRONTEND_PORT in the base file is local Compose only.

services:
  postgres:
    ports: !reset []
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD for production Compose}

  object-storage:
    ports: !reset []
    environment:
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET - run ./init-env.sh}
      SETUP_TOKEN: ${SETUP_TOKEN:?set SETUP_TOKEN - run ./init-env.sh}
      SIGNING_SECRET: ${SIGNING_SECRET:?set SIGNING_SECRET - run ./init-env.sh}
      NOS_JWT_SECRET: ${NOS_JWT_SECRET:?set NOS_JWT_SECRET - run ./init-env.sh}
      NOS_SIGNING_SECRET: ${NOS_SIGNING_SECRET:?set NOS_SIGNING_SECRET - run ./init-env.sh}
      OBJECT_STORAGE_JWT_SECRET: ${OBJECT_STORAGE_JWT_SECRET:?set OBJECT_STORAGE_JWT_SECRET - run ./init-env.sh}

  backend:
    ports: !reset []
    environment:
      OWNLY_ENVIRONMENT: production
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-ownly}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ownly}}
      # Human: Frontend nginx is the sole entrypoint — trust its forwarding headers for rate limits.
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-true}
      OWNLY_ALLOW_PRIVATE_OUTBOUND: ${OWNLY_ALLOW_PRIVATE_OUTBOUND:-0}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?set CORS_ALLOWED_ORIGINS for production Compose}
      # Human: Production must not fall back to committed compose-dev literals (API rejects them anyway).
      # Agent: REQUIRES values from .env (init-env.sh) or exported secrets — no :- defaults.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET - run ./init-env.sh}
      SETUP_TOKEN: ${SETUP_TOKEN:?set SETUP_TOKEN - run ./init-env.sh}
      SIGNING_SECRET: ${SIGNING_SECRET:?set SIGNING_SECRET - run ./init-env.sh}
      NOS_JWT_SECRET: ${NOS_JWT_SECRET:?set NOS_JWT_SECRET - run ./init-env.sh}
      NOS_SIGNING_SECRET: ${NOS_SIGNING_SECRET:?set NOS_SIGNING_SECRET - run ./init-env.sh}
      OBJECT_STORAGE_JWT_SECRET: ${OBJECT_STORAGE_JWT_SECRET:?set OBJECT_STORAGE_JWT_SECRET - run ./init-env.sh}

  frontend:
    ports: !reset []
